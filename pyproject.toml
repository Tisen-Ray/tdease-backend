[project]
name = "tdease-backend"
version = "0.2.0"
description = "TDEaseNexus — Zero-architecture mass spectrometry backend"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11,<3.15"
dependencies = [
    # Web framework
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.41.0",
    # Database
    "sqlalchemy>=2.0.48",
    "sqlmodel>=0.0.37",
    # Data
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-multipart>=0.0.22",
    "aiofiles>=25.1.0",
    "websockets>=16.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.6",
    # Locked mature workflow implementation behind TDEase's private runtime entry.
    "snakemake==9.23.1",
    "snakemake-interface-executor-plugins>=9.3.2",
    "snakemake-interface-common>=1.20.1",
    "snakemake-interface-storage-plugins>=4.4.1",
    "snakemake-interface-logger-plugins>=1.1.0",
    "snakemake-interface-scheduler-plugins>=2.0.0",
    # Snakemake's own deps (needed by internalized engine)
    "psutil>=7.2.2",
    "pulp>=2.3.1",
    "configargparse",
    "connection_pool>=0.0.3",
    "smart-open>=4.0",
    "dpath>=2.1.6",
    "yte>=1.5.5",
    "wrapt",
    "tabulate",
    "immutables",
    "nbformat",
    # TDEase domain
    "pandas>=3.0.1",
    "polars>=1.18.0",
    "numpy>=2.4.2",
    "scipy>=1.14.0",
    "scikit-misc>=0.1.5",
    "massql>=2025.12.10",
    "pyteomics>=4.7.5",
    "spectrum-utils>=0.5.0",
    "brain-isotopic-distribution>=1.5.0",
]

[project.optional-dependencies]
prod = ["gunicorn>=22.0.0"]

[project.scripts]
tdease-backend = "cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.10.0",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "src"]
# The composition root lives at the repository root (not inside `src/`), so it is
# shipped as a top-level module -- docs/design/THREE-REPOSITORY-ARCHITECTURE.md §4.1.
# hatchling has no `py-modules` option (that is setuptools syntax, silently
# ignored); force-include is what actually lands cli.py at the wheel root.
force-include = { "cli.py" = "cli.py" }

[tool.coverage.run]
source = ["app", "src"]

[tool.isort]
profile = "black"

[tool.ruff]
# black's default width — the formatting authority is `ruff format`, checked
# in CI (docs/HARNESS-ENGINEERING-PLAN.md H5/3.4). mypy stays deferred.
line-length = 88

[tool.ruff.lint]
# The rule set is PINNED explicitly (never inherit ruff's evolving defaults):
# import sorting (I) must stay OUT — `engine_runner.main()` declares snakemake
# imports in a deliberate order (api before workflow); sorting them triggers a
# circular import inside snakemake itself. If a future default batch ever
# turns I on, this pin keeps the gate honest.
select = ["E4", "E7", "E9", "F"]
# Waived categories are deliberate architecture, not debt:
# - BLE001 / S110: the engine/worker boundaries CONTAIN broad exceptions by
#   design — a worker escape would requeue the claim and crash-loop the
#   Backend (docs/design/BACKEND-HARDENING.md, STATUS "No silent worker
#   deaths"). Logging-or-passing is the intended shape there.
# - TRY004: wrong-type inputs raise ValueError so the failure envelope maps
#   them to their contracted code; TypeError would change wire behavior.
ignore = ["BLE001", "S110", "TRY004"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*",
]
