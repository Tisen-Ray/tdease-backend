[project]
name = "tdease-backend"
version = "0.2.0"
description = "TDEase-nexus — Zero-architecture mass spectrometry backend"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    # Web framework
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.41.0",
    # Database
    "sqlalchemy>=2.0.48",
    "sqlmodel>=0.0.37",
    # Data
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-multipart>=0.0.22",
    "aiofiles>=25.1.0",
    "websockets>=16.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.6",
    # Locked mature workflow implementation behind TDEase's private runtime entry.
    "snakemake==9.23.1",
    "snakemake-interface-executor-plugins>=9.3.2",
    "snakemake-interface-common>=1.20.1",
    "snakemake-interface-storage-plugins>=4.4.1",
    "snakemake-interface-logger-plugins>=1.1.0",
    "snakemake-interface-scheduler-plugins>=2.0.0",
    # Snakemake's own deps (needed by internalized engine)
    "psutil>=7.2.2",
    "pulp>=2.3.1",
    "configargparse",
    "connection_pool>=0.0.3",
    "smart-open>=4.0",
    "dpath>=2.1.6",
    "yte>=1.5.5",
    "wrapt",
    "tabulate",
    "immutables",
    "nbformat",
    # TDEase domain
    "pandas>=3.0.1",
    "polars>=1.18.0",
    "numpy>=2.4.2",
    "scipy>=1.14.0",
    "massql>=2025.12.10",
    "pyteomics>=4.7.5",
    "spectrum-utils>=0.5.0",
    "brain-isotopic-distribution>=1.5.0",
]

[project.optional-dependencies]
prod = ["gunicorn>=22.0.0"]

[project.scripts]
tdease-backend = "cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "src"]
# The composition root lives at the repository root (not inside `src/`), so it is
# shipped as a top-level module -- docs/design/THREE-REPOSITORY-ARCHITECTURE.md §4.1.
py-modules = ["cli"]

[tool.coverage.run]
source = ["app", "src"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*",
]
