server {
    listen       80;
    server_name  localhost;

    # ------------------------------------------------------------------
    # Gzip
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ------------------------------------------------------------------
    # Static files
    # ------------------------------------------------------------------
    root   /usr/share/nginx/html;
    index  index.html;

    # ------------------------------------------------------------------
    # SPA fallback — serve index.html for any non-file route
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------
    # Security: hide Nginx version
    # ------------------------------------------------------------------
    server_tokens off;

    # ------------------------------------------------------------------
    # Deny access to dot-files (env-config.js is intentionally served)
    # ------------------------------------------------------------------
    location ~ /\. {
        deny all;
        return 404;
    }

    # ------------------------------------------------------------------
    # Cache control for static assets (fingerprinted by Vite)
    # ------------------------------------------------------------------
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------------------------
    # Do NOT emit a server-level 404 — let the SPA handle routing
    # ------------------------------------------------------------------
    error_page 404 =200 /index.html;
}
