<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TDEase - Starting</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f4f1e8;
    }
    #splash {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      width: 100vw; height: 100vh;
      gap: 22px; padding: 34px;
    }
    .logo {
      font-size: 38px; font-weight: 700; letter-spacing: 1px;
      color: #2c3e50;
    }
    .logo .accent { color: #3b82f6; }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid #e0ddd4;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status {
      font-size: 15px; color: #6b7280; min-height: 22px;
      text-align: center; max-width: 430px; line-height: 1.5;
    }
    #error-box {
      display: none;
      flex-direction: column; gap: 12px;
      width: min(520px, calc(100vw - 48px));
    }
    #error-msg {
      font-size: 12px; color: #b91c1c; line-height: 1.55;
      background: #fef2f2; border: 1px solid #fecaca;
      padding: 12px 14px; border-radius: 8px;
      white-space: pre-wrap; font-family: "Consolas", monospace;
      max-height: 118px; overflow: auto;
    }
    .actions {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    }
    button {
      padding: 8px 14px; font-size: 13px;
      background: #3b82f6; color: white; border: none;
      border-radius: 6px; cursor: pointer;
    }
    button.secondary { background: #4b5563; }
    button.danger { background: #b91c1c; }
    button:hover { filter: brightness(0.95); }
    .hint {
      font-size: 12px; color: #6b7280; text-align: center; line-height: 1.45;
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo">TD<span class="accent">Ease</span></div>
    <div class="spinner" id="spinner"></div>
    <div id="status">正在启动...</div>
    <div id="error-box">
      <div id="error-msg"></div>
      <div class="actions">
        <button id="retry-btn">重试</button>
        <button id="logs-btn" class="secondary">打开日志</button>
        <button id="uv-btn" class="secondary">运行环境帮助</button>
        <button id="quit-btn" class="danger">退出</button>
      </div>
      <div class="hint">TDEase 使用安装包内置运行环境；env 配置文件位于应用数据目录。</div>
    </div>
  </div>
  <script>
    const { ipcRenderer } = require("electron");
    const statusEl = document.getElementById("status");
    const spinnerEl = document.getElementById("spinner");
    const errorBox = document.getElementById("error-box");
    const errorMsg = document.getElementById("error-msg");
    const retryBtn = document.getElementById("retry-btn");
    const logsBtn = document.getElementById("logs-btn");
    const uvBtn = document.getElementById("uv-btn");
    const quitBtn = document.getElementById("quit-btn");

    const STAGE_LABELS = {
      "uv-sync": "正在准备 Python 后端环境（首次启动，可能需要数分钟）",
      "db-init": "正在初始化数据库",
      "cleanup-backend": "正在清理旧后端进程",
    };

    function showStarting() {
      spinnerEl.style.display = "block";
      statusEl.style.display = "block";
      statusEl.textContent = "正在启动...";
      errorBox.style.display = "none";
      errorMsg.textContent = "";
    }

    ipcRenderer.on("splash:reset", showStarting);

    ipcRenderer.on("splash:progress", (_e, info) => {
      const label = STAGE_LABELS[info.stage] || info.message || "正在启动...";
      statusEl.textContent = label;
    });

    ipcRenderer.on("splash:error", (_e, err) => {
      spinnerEl.style.display = "none";
      statusEl.style.display = "none";
      errorBox.style.display = "flex";
      errorMsg.textContent = (err.code || "ERROR") + ": " + (err.message || "未知错误");
    });

    retryBtn.addEventListener("click", () => {
      showStarting();
      ipcRenderer.send("splash:retry");
    });
    logsBtn.addEventListener("click", () => ipcRenderer.invoke("desktop:open-logs"));
    uvBtn.addEventListener("click", () => ipcRenderer.invoke("desktop:open-uv-docs"));
    quitBtn.addEventListener("click", () => ipcRenderer.send("splash:quit"));
  </script>
</body>
</html>
